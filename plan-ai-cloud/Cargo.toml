[package]
name = "plan-ai-cloud"
version = "0.1.0"
edition = "2024"

[lib]
name = "plan_ai_cloud"
path = "src/lib.rs"

[[bin]]
name = "plan-ai-cloud"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
aes-gcm = "0.10"
hkdf = "0.12"
mac-mgmt-common = { path = "../common" }
reqwest = { workspace = true }
rmcp = { version = "0.17", features = ["server", "transport-io", "macros"], default-features = false }
rustls = { workspace = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full", "signal"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "0.17", features = ["client", "transport-child-process", "macros"], default-features = false }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
