[workspace]
members = ["common", "daemon", "mac-mgmt-executor", "mac-mgmt-healer", "mac-mgmt-services", "mac-mgmt-ws", "nix-driver-sync", "plan-ai-auth", "plan-ai-cleaner", "plan-ai-cloud", "plan-ai-memvault-share-agent", "runner", "server", "relay", "relay-ssh", "sim-tests", "trainer", "web-agency/cloudflare-api", "web-agency/spaceship-api", "web-agency/changedetection-api", "web-agency/dataforseo-api", "web-agency/server", "web-agency/upload-cli", "web-agency/proxy"]
# memvault and plan-ai-design are independent submodules with their own
# workspace roots. They are NOT members here — Cargo workspaces cannot nest.
# Crates that need them depend by path (memvault) or git URL (plan-ai-design),
# resolving against the submodules' own workspaces. excluded so member scanning
# never tries to absorb them.
exclude = ["memvault", "plan-ai-design"]
resolver = "3"

[workspace.dependencies]
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "json", "query"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "logging", "std", "tls12"] }
sentry = { version = "0.47", default-features = false, features = ["reqwest", "panic", "backtrace", "contexts", "debug-images"] }
which = "7"
rmcp = { version = "0.17", default-features = false, features = ["server", "transport-io", "macros"] }
libp2p = { version = "0.56", default-features = false, features = ["tokio", "noise", "yamux", "quic", "tcp", "mdns", "request-response", "identify", "ping", "gossipsub", "kad", "macros", "serde", "ed25519"] }

[patch.crates-io]
dioxus = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-server = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-i18n = { git = "https://github.com/mkg20001/dioxus-i18n.git", branch = "feat/dioxus-0.8" }
dioxus-tabular = { git = "https://github.com/mkg20001/dioxus-tabular.git", branch = "feat/dioxus-0.8" }
swiftide = { git = "https://github.com/mkg20001/swiftide.git", branch = "mac-mgmt-patches" }
swiftide-agents = { git = "https://github.com/mkg20001/swiftide.git", branch = "mac-mgmt-patches" }
swiftide-core = { git = "https://github.com/mkg20001/swiftide.git", branch = "mac-mgmt-patches" }
swiftide-integrations = { git = "https://github.com/mkg20001/swiftide.git", branch = "mac-mgmt-patches" }
swiftide-indexing = { git = "https://github.com/mkg20001/swiftide.git", branch = "mac-mgmt-patches" }
swiftide-macros = { git = "https://github.com/mkg20001/swiftide.git", branch = "mac-mgmt-patches" }
swiftide-query = { git = "https://github.com/mkg20001/swiftide.git", branch = "mac-mgmt-patches" }

# memvault-web references plan-ai-design by git URL. In this combined build,
# redirect it to the top-level submodule checkout so server, web-agency/server,
# and memvault-web all resolve to a single plan-ai-design package (no duplicate
# crate). This patch wins over memvault's own (only the build root's applies).
[patch."ssh://git@git.plan.ai/plan-ai/design"]
plan-ai-design = { path = "plan-ai-design" }
