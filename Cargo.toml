[package]
name = "mac-mgmt"
version = "0.1.4"
edition = "2024"

[dependencies]
clap = { version = "4", features = ["derive"] }
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-tar", "compression-flate2"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
sentry = { version = "0.35", default-features = false, features = ["rustls", "reqwest", "panic", "backtrace", "contexts", "debug-images", "log"] }
rust-embed = "8"
tempfile = "3"
self-replace = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
