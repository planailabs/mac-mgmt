[workspace]
members = ["common", "daemon", "mac-mgmt-services", "mac-mgmt-ws", "runner", "server", "relay", "relay-ssh"]
resolver = "3"

[workspace.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
sentry = { version = "0.35", default-features = false, features = ["rustls", "reqwest", "panic", "backtrace", "contexts", "debug-images"] }
which = "7"
