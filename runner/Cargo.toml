[package]
name = "mac-mgmt-runner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mac-mgmt-runner"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
hex = "0.4"
mac-mgmt-common = { path = "../common", features = ["observability"] }
mustache = "0.9"
rand = "0.8"
reqwest = { workspace = true }
rocket = { version = "0.5", default-features = false, features = ["json"] }
sentry = { workspace = true, features = ["anyhow"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ssh-key = { version = "0.6", features = ["ed25519", "rand_core"] }
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
# Used in tests only, to verify our host-key fingerprint matches the
# algorithm the daemon runs (daemon uses russh's PublicKeyBase64::public_key_bytes).
russh = { version = "0.59", default-features = false, features = ["ring"] }
