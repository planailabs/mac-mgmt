# Fine-tuning configuration for mac-mgmt healer model.
# Override any value via CLI: --base-model, --lora-rank, etc.

base_model: "Qwen/Qwen2.5-Coder-7B-Instruct"
output_dir: "./finetune-output"

# QLoRA parameters
lora_rank: 32
lora_alpha: 64
lora_dropout: 0.05
load_in_4bit: true

# Training parameters
epochs: 3
learning_rate: 2.0e-4
lr_scheduler: "cosine"
warmup_ratio: 0.1
per_device_batch_size: 2
gradient_accumulation_steps: 8  # effective batch = 16
max_seq_length: 4096

# Regularization
neftune_noise_alpha: 5.0

# Evaluation
eval_steps: 0.5  # fraction of epoch
eval_fraction: 0.15

# GGUF export
gguf_quantization: "q5_k_m"
ollama_model_name: "mac-mgmt-healer"
