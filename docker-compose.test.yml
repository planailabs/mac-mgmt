services:
  test-mac-mgmt-server:
    image: registry.plan.ai/plan-ai/mac-mgmt/test-mac-mgmt-server:latest
    container_name: test-mac-mgmt-server
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    networks:
      mac-mgmt-test:
        aliases:
          - test-mac-mgmt-xzar

  test-mac-mgmt-relay:
    image: registry.plan.ai/plan-ai/mac-mgmt/test-mac-mgmt-relay:latest
    container_name: test-mac-mgmt-relay
    tmpfs:
      - /run
      - /run/lock
      - /tmp

    depends_on:
      - test-mac-mgmt-server
    networks:
      - mac-mgmt-test

  test-mac-mgmt-daemon:
    image: registry.plan.ai/plan-ai/mac-mgmt/test-mac-mgmt-daemon:latest
    container_name: test-mac-mgmt-daemon
    tmpfs:
      - /run
      - /run/lock
      - /tmp
    depends_on:
      - test-mac-mgmt-server
      - test-mac-mgmt-relay
    networks:
      - mac-mgmt-test

networks:
  mac-mgmt-test:
    driver: bridge
