[package]
name = "mac-mgmt-config-ui"
version = "0.1.0"
edition = "2024"

# Its own workspace root (like plan-ai-design / mac-mgmt-overview) so it builds
# standalone and isn't absorbed by the parent workspace. Depended on by path
# from BOTH the server (a workspace member) and the overview (its own
# workspace), giving one shared, schema-driven config editor — not a clone.
[workspace]

[patch.crates-io]
dioxus = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-server = { git = "https://github.com/mkg20001/dioxus.git", branch = "feat/embed" }
dioxus-i18n = { git = "https://github.com/mkg20001/dioxus-i18n.git", branch = "feat/dioxus-0.8" }
dioxus-tabular = { git = "https://github.com/mkg20001/dioxus-tabular.git", branch = "feat/dioxus-0.8" }

[lib]
name = "mac_mgmt_config_ui"
path = "src/lib.rs"

[dependencies]
dioxus = "0.8.0-alpha.0"
plan-ai-design = { path = "../memvault/plan-ai-design" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
