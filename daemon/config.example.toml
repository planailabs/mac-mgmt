# mac-mgmt daemon configuration
# All sections are optional — sensible defaults are used when omitted.
# Place this file at: ~/.config/mac-mgmt/config.toml

# ── Daemon behavior ──────────────────────────────────────────────────
# Controls the daemon's own operational parameters.
# All fields are optional; shown values are the defaults.
# [daemon]
# How often to check for binary updates, sync skills, and sync MCP servers.
# Accepts human-readable durations: "30s", "5m", "1h", "2h30m", etc.
# update_interval = "1h"
#
# How often to run health checks on managed services.
# health_interval = "1m"
#
# Log verbosity. One of: error, warn, info, debug, trace
# Can also be overridden at runtime via RUST_LOG env var.
# log_level = "info"
#
# Time window during which binary and nix upgrades are allowed.
# Format: "HH:MM-HH:MM" (24-hour, local time). Supports midnight crossing.
# Omit to allow upgrades at any time. Skills/MCP/SSH sync is not affected.
# upgrade_window = "02:00-05:00"

# ── Global ───────────────────────────────────────────────────────────
# Controls which provider the agent uses by default.
# Individual providers are toggled via their own `enabled` flag.
[global]
# Default LLM backend: "ollama", "lms", "cloud", or "none"
default_llm = "none"
# Default agent provider: "openclaw" or "none"
default_agent = "none"

# ── Metrics ──────────────────────────────────────────────────────────
# Prometheus metrics endpoint. Scraped by monitoring systems.
# Exposes: mac_mgmt_service_healthy, mac_mgmt_service_upgrade_pending,
#          mac_mgmt_service_busy (per-service gauges).
[metrics]
port = 9396

# ── OpenClaw ─────────────────────────────────────────────────────────
# OpenClaw AI gateway configuration.
# Toggle with enabled = true/false. Active when global.default_agent = "openclaw".
# [openclaw]
# enabled = false
# Gateway settings merged into ~/.openclaw/openclaw.json.
# These are typed, validated fields for common settings.
# [openclaw.gateway]
# port = 8080
# host = "127.0.0.1"
#
# Skills auto-update behavior.
# [openclaw.skills]
# auto_update = true
#
# Telegram bot integration. Connects OpenClaw to a Telegram bot so users
# can chat with the agent via Telegram.
# [openclaw.telegram]
# bot_token = "123456:ABC-DEF..."          # from @BotFather
# allowed_chat_ids = [123456789, -100...]  # optional; empty = allow all
# enabled = true                           # default: true
#
# Escape hatch: arbitrary key-value pairs merged into openclaw.json
# AFTER the typed fields above. Use for niche settings not covered above.
# extra_config = { "some" = { "deep" = { "key" = "value" } } }

# ── OpenCode ─────────────────────────────────────────────────────────
# OpenCode AI agent configuration.
# Toggle with enabled = true/false. Active when global.default_agent = "opencode".
# [opencode]
# enabled = false
# port = 18790
# host = "127.0.0.1"
# Arbitrary key-value pairs merged into the opencode config.
# extra_config = { "model" = "anthropic/claude-sonnet-4-6" }

# ── Ollama ───────────────────────────────────────────────────────────
# Ollama LLM inference engine. Toggle with enabled = true/false.
[ollama]
# enabled = false
host = "127.0.0.1"
port = 11434
# Models to pull on startup. At least one required.
models = ["phi4-mini", "qwen3.5", "Flux_AI/Flux_AI"]
default_model = "phi4-mini"
# Package flavour determines GPU support.
# Options: cpu, rocm (AMD), cuda (NVIDIA), vulkan
# "cpu" installs "ollama", others install "ollama-{flavour}".
flavour = "cpu"
# Context length passed as OLLAMA_CONTEXT_LENGTH env var.
# context_length = 16384


# ── Unsloth ──────────────────────────────────────────────────────────
# Unsloth Studio - local LLM inference, fine-tuning, and training.
# Toggle with enabled = true/false.
# [unsloth]
# enabled = false
# host = "127.0.0.1"
# port = 8888
# default_model = ""

# ── LiteLLM ──────────────────────────────────────────────────────────
# LiteLLM proxy - unified OpenAI-compatible API for all cloud LLM providers.
# When enabled, replaces direct cloud→agent connectors with a single proxy.
# Cloud provider configs (below) are auto-converted to a LiteLLM config YAML.
# [litellm]
# enabled = false
# host = "127.0.0.1"
# port = 4100
# master_key = "sk-your-master-key"

# ── Notifications (via apprise) ──────────────────────────────────────
# Push notifications when daemon events occur (crashes, upgrades, etc.).
# Uses the apprise CLI for delivery — supports 100+ services including
# Telegram, Slack, Discord, email, Matrix, Gotify, ntfy, and more.
#
# Install: pip install apprise (or nix, brew, etc.)
# URL formats: https://github.com/caronc/apprise/wiki
#
# Available events:
#   service_crashed      — a managed service process exited unexpectedly
#   service_unhealthy    — a health check failed
#   service_recovered    — a previously unhealthy service is healthy again
#   upgrade_installed    — a nix package upgrade was applied
#   upgrade_failed       — a nix package upgrade failed
#   backup_completed     — a restic backup completed successfully
#   backup_failed        — a restic backup failed
#   daemon_started       — the mac-mgmt daemon started
#   daemon_stopped       — the mac-mgmt daemon is shutting down
#
# [notifications]
# Apprise notification URLs. Add one per service you want to notify.
# urls = [
#     "tgram://bot_token/chat_id",
#     "slack://token_a/token_b/token_c/#channel",
#     "discord://webhook_id/webhook_token",
#     "ntfy://ntfy.sh/my-topic",
# ]
# Which events trigger notifications. Omit to notify on ALL events.
# events = ["service_crashed", "service_unhealthy", "upgrade_installed"]

# ── Server connection ────────────────────────────────────────────────
# Connect to a mac-mgmt management server for centralized configuration.
# When configured, the daemon fetches a base config from the server and
# merges local settings on top (local always wins).
# [server]
# url = "https://mgmt.example.com:8080"
# token = "cluster-token-here"

# ── Relay ────────────────────────────────────────────────────────────
# Connect to a relay server for remote SSH access to this machine.
# The WebSocket connection to the relay is always active when a URL is
# configured (for metrics proxying, etc.). The remote_ssh_enabled flag
# controls whether inbound SSH sessions are accepted. This can also be
# toggled at runtime via the FIFO (~/.config/mac-mgmt/remote-ssh).
# tunnels_enabled controls whether service tunnels (TCP, file, shell)
# are exposed via the relay. Enabled by default.
# [relay]
# relay_multiaddr = "/dns4/relay.example.com/tcp/443/wss"  # libp2p multiaddress for relay node
# remote_ssh_enabled = false
# tunnels_enabled = true
# fake_origin_local = true  # rewrite Host/Referer/Origin and strip forwarding headers in tunnel proxying
# mdns_enabled = true       # local peer discovery via mDNS
# p2p_port = 1122           # QUIC listen port for p2p connections
# ai_proxy_distribution = true  # distribute AI proxy requests across cluster peers
# cluster_psk = "..."       # pre-shared key for peer auth (hex, 32 bytes; generated by server)

# ── Healer (per-cluster overrides) ──────────────────────────────────
# These settings override server-global healer defaults for this cluster.
# Pushed from the server via cluster config merge.
# [healer]
# auto_trigger = false                  # enable auto-triggered healer sessions
# auto_trigger_provider = "ollama"      # provider for auto-triggered sessions
# auto_trigger_model = "gemma4"         # model for auto-triggered sessions
# auto_approve = false                  # skip approval gate between diagnosis and fix
# fix_provider = "anthropic"            # separate model for the remediation phase
# fix_model = "claude-sonnet-4-6"       # (optional, uses diagnosis model if omitted)

# ── AI API Proxy ────────────────────────────────────────────────────
# OpenAI-compatible API proxy with per-key authentication and
# sliding-window token budgets. Sits in front of Ollama/Unsloth and
# is exposed via the relay tunnel as "ai-proxy".
# [ai_proxy]
# enabled = false
# port = 18900
# host = "127.0.0.1"
#
# API keys — each key gets its own token budget and sliding window.
# Keys are stored as hex-encoded SHA2-256 multihashes; the raw key is
# only shown once on generation (via the web UI or CLI).
# Generate a key_hash with:
#   echo -n "your-secret-key" | sha256sum  (then wrap as multihash)
# [[ai_proxy.keys]]
# name = "dev-team"
# key_hash = "1220..."                # hex-encoded multihash of the API key
# token_budget = 1000000              # 0 = unlimited
# budget_window = "24h"               # sliding window (humantime format)
# enabled = true

# ── Backup (restic) ─────────────────────────────────────────────────
# Periodic backups of service data using restic.
# Automatically discovers paths from managed services (config, data dirs).
# [backup]
# enabled = false
# Restic repository path or URL.
# Local: "/backup/restic"
# S3:    "s3:bucket-name/prefix"
# SFTP:  "sftp:user@host:/path"
# repository = "/backup/restic"
#
# Path to password/key file for repository encryption.
# If omitted, a random key is auto-generated at ~/.config/mac-mgmt/restic-key
# password_file = "/path/to/restic-key"
#
# How often to run backups. Default: "6h"
# interval = "6h"
#
# Retention policy: keep snapshots from the last N duration. Default: "7d"
# keep_within = "7d"
#
# Extra paths to include beyond auto-detected service paths.
# extra_paths = ["/home/user/important-data"]
#
# Glob patterns to exclude from backups.
# exclude = ["*.tmp", "*.log"]
#
# Include large model caches (ollama models, lm-studio cache). Default: false
# include_models = false
#
# Environment variables for restic (e.g. S3 credentials).
# [backup.env]
# AWS_ACCESS_KEY_ID = "..."
# AWS_SECRET_ACCESS_KEY = "..."

# ── Cloud LLM providers ─────────────────────────────────────────────
# Cloud providers are registered with the configured agent (OpenClaw/OpenCode).
# All enabled providers are available; the one matching default_llm is the default.
# Can be a single [[cloud]] entry or a list.
# [[cloud]]
# provider = "anthropic"                # anthropic, openai, google, mistral, groq, xai,
#                                       # deepseek, openrouter, together, bedrock
# api_key = "sk-ant-xxx"                # literal value
# api_key = "env:ANTHROPIC_API_KEY"     # from ~/.config/mac-mgmt/.env
# api_key = "secret:anthropic-key"      # from server vault
# default_model = "anthropic/claude-sonnet-4-6"
# enabled = true
# [[cloud]]
# provider = "openrouter"
# api_key = "sk-or-xxx"
# default_model = "openrouter/auto"

# ── Memvault (p2p AI memory store) ──────────────────────────────────
# Requires the daemon to be compiled with --features memvault.
# All fields are optional; shown values are the defaults.
# [memvault]
# enabled = false
# data_dir = "~/.local/share/memvault"
# cluster_id = ""                        # base58-encoded 32-byte cluster ID, or leave empty
# bootstrap_peers = []                   # libp2p multiaddrs for Kademlia bootstrap
# port = 8401                            # API server port (token auto-generated in data_dir/api.token)

# ── Custom services ────────────────────────────────────────────────────
# Define virtual services entirely through config. Each [[custom-service]]
# entry creates one service that can expose tunnels, probes, inventory,
# security checks, shell commands, and file tunnels.
#
# If `spawn` is present, the daemon supervises the process (managed mode).
# If omitted, the service is integrated (no process, capabilities only).
#
# [[custom-service]]
# name = "my-app"
# enabled = true
#
# # Optional: spawn and supervise a process (makes it a managed service)
# [custom-service.spawn]
# command = "my-app-server"
# args = ["--config=/etc/my-app/config.toml"]
# [custom-service.spawn.env]
# MY_APP_LOG = "info"
#
# # Optional: health check command (exit 0 = healthy)
# [custom-service.health_check]
# command = "curl"
# args = ["-sf", "http://127.0.0.1:8080/health"]
# timeout_secs = 10
#
# # TCP tunnels — expose local ports through the relay
# [[custom-service.tunnels]]
# name = "my-app-web"
# host = "127.0.0.1"
# port = 8080
#
# # File tunnels — expose files/folders for remote editing
# [[custom-service.files]]
# kind = "file"
# name = "my-app-config"
# path = "/etc/my-app/config.toml"
# writable = true
# description = "Main application config"
#
# # Shell commands — predefined commands for remote execution
# [[custom-service.commands]]
# name = "my-app-reload"
# command = "systemctl"
# args = ["reload", "my-app"]
# description = "Reload application configuration"
# timeout_secs = 30
#
# # Probes — periodic health/functional checks
# [[custom-service.probes]]
# name = "my-app-health"
# kind = "liveness"                       # "liveness" or "functional"
# [custom-service.probes.http]
# url = "http://127.0.0.1:8080/health"
# method = "GET"
# expected_status = 200
# timeout_secs = 10
#
# # Inventory — static facts collected every 6h
# [[custom-service.inventory]]
# id = "my_app_version"
# name = "App Version"
# value_type = "string"                   # "string", "number", "bool", "json"
# [custom-service.inventory.command]
# run = "my-app"
# args = ["--version"]
# parse_regex = "v([\\d.]+)"             # first capture group used
#
# # Samples — dynamic values collected every heartbeat (~1min)
# [[custom-service.samples]]
# id = "active_connections"
# name = "Active Connections"
# value_type = "number"
# [custom-service.samples.command]
# run = "curl"
# args = ["-s", "http://127.0.0.1:8080/metrics"]
# parse_regex = "connections_active (\\d+)"
#
# # Security checks — evaluated every 6h
# [[custom-service.security]]
# id = "config_perms"
# severity = "medium"                     # "info", "low", "medium", "high", "critical"
# message = "Config file should not be world-readable"
# [custom-service.security.file_check]
# path = "/etc/my-app/config.toml"
# exists = true
# max_mode = "0640"                       # octal permission ceiling
