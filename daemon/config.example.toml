[metrics]
port = 9396

[openclaw]
provider = "ollama"
# Extra configuration merged into ~/.openclaw/openclaw.json
# extra_config = { "key" = "value" }

[ollama]
host = "127.0.0.1"
port = 11434
models = ["phi4-mini", "qwen3.5", "Flux_AI/Flux_AI"]
default_model = "phi4-mini"
# Package flavour: cpu, rocm, cuda, vulkan
# "cpu" installs "ollama", others install "ollama-{flavour}"
flavour = "cpu"

