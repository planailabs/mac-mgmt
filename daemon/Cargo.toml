[package]
name = "mac-mgmt"
version = "0.1.5"
edition = "2024"

[features]
default = ["services", "relay"]
services = []
self-update = ["dep:self_update", "dep:self-replace"]
relay = ["dep:russh", "dep:tokio-tungstenite", "dep:futures-util", "dep:urlencoding"]

[dependencies]
clap = { version = "4", features = ["derive"] }
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-tar", "compression-flate2"], optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
bytes = "1"
sentry = { version = "0.35", default-features = false, features = ["rustls", "reqwest", "panic", "backtrace", "contexts", "debug-images", "log"] }
rust-embed = "8"
tempfile = "3"
self-replace = { version = "1", optional = true }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rocket = { version = "0.5", default-features = false }
prometheus = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
russh = { version = "0.59", default-features = false, features = ["ring", "flate2"], optional = true }
rand = "0.8"
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-webpki-roots"], optional = true }
futures-util = { version = "0.3", optional = true }
urlencoding = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"] }
mac-mgmt-common = { path = "../common" }
