[package]
name = "mac-mgmt"
version = "0.1.5"
edition = "2024"

[features]
default = ["services", "relay"]
services = []
self-update = ["dep:self_update", "dep:self-replace"]
relay = ["dep:urlencoding"]

[dependencies]
clap = { version = "4", features = ["derive"] }
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-tar", "compression-flate2"], optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
sentry = { workspace = true, features = ["log"] }
rust-embed = "8"
tempfile = "3"
self-replace = { version = "1", optional = true }
sha2 = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rocket = { version = "0.5", default-features = false, features = ["json"] }
prometheus = "0.14"
reqwest = { workspace = true, features = ["blocking", "stream"] }
russh = { version = "0.59", default-features = false, features = ["ring", "flate2"] }
rand = "0.8"
mac-mgmt-ws = { path = "../mac-mgmt-ws", features = ["client"] }
futures-util = "0.3"
urlencoding = { version = "2", optional = true }
uuid = { version = "1", features = ["v4"] }
mac-mgmt-common = { path = "../common" }
mac-mgmt-services = { path = "../mac-mgmt-services" }
dirs = "6"
glob = "0.3"
hex = "0.4"
hostname = "0.4"
humantime = "2"
notify = "7"
strip-ansi-escapes = "0.2"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
