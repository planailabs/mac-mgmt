[package]
name = "mac-mgmt"
version = "0.1.5"
edition = "2024"

[lib]
name = "mac_mgmt_daemon"
path = "src/lib.rs"

[[bin]]
name = "mac-mgmt"
path = "src/main.rs"

[features]
default = ["services", "relay", "memvault"]
services = ["mac-mgmt-agent/services"]
self-update = ["dep:self_update", "dep:self-replace"]
relay = ["mac-mgmt-agent/relay"]
memvault = ["mac-mgmt-agent/memvault", "memctl/daemon", "relay"]
healer = ["dep:mac-mgmt-healer", "services", "relay"]
embed = ["memvault-web/embed", "memctl/embed"]
# Sovereign-AI USB build: self-contained, relocatable stack run off a flash
# stick. Pulls in the service supervisor, memvault, embedded UI assets, the
# self-contained binary updater (self-replace), and tarball/extraction helpers
# for nix-portable + GitLab release downloads. The native overview desktop app
# is an optional workspace crate pulled in separately.
usb = [
    "services", "memvault", "embed",
    "dep:self-replace", "dep:tar", "dep:flate2", "dep:schemars", "dep:axum",
]
# Sovereign-AI USB *daemon*: the reduced phone-home control plane for the
# plan-ai-usb-minimal stack. Reuses the heartbeat / probe / relay / config-sync
# machinery but is driven by the reduced `UsbConfig` and runs its services
# spawn-from-mount (no nix install/upgrade). Distinct from `usb` (the nix-portable
# stack): no `embed`, no nix-portable / store-image machinery.
usbd = ["services", "memvault", "relay", "dep:schemars", "dep:axum"]
# The native overview desktop app (wry/webkitgtk). Kept separate from `usb` so
# the headless stack (and all tests/CI) builds without the desktop GUI stack;
# the release build adds it. Requires webkit2gtk at build time (see flake.nix).
usb-ui = ["usb", "dep:mac-mgmt-overview"]
sim = ["mac-mgmt-agent/sim"]
# WASM client for the memvault web UI — built by dx for embedding.
# Both `web` and `server` (via memvault) compile the same App component from
# the same crate, ensuring hydration entry ordering matches perfectly.
web = ["dep:memvault-web", "memvault-web/web", "dep:dioxus", "getrandom_04/wasm_js"]

# Dependencies needed for both native and WASM builds
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom_04 = { package = "getrandom", version = "0.4" }

# WASM-only dependencies (web feature)
memvault-web = { path = "../memvault/crates/memvault-web", optional = true, default-features = false }
dioxus = { version = "0.8.0-alpha.0", features = ["fullstack", "router"], optional = true }

# Native-only dependencies (not compiled for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-tar", "compression-flate2"], optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
sentry = { workspace = true, features = ["log"] }
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
tempfile = "3"
self-replace = { version = "1", optional = true }
tar = { version = "0.4", optional = true }
flate2 = { version = "1", optional = true }
schemars = { version = "1.2.1", features = ["derive"], optional = true }
sha2 = "0.10"
libc = "0.2"
toml = "0.8"
rocket = { version = "0.5", default-features = false, features = ["json"] }
reqwest = { workspace = true, features = ["blocking", "stream"] }
rustls = { workspace = true }
russh = { version = "0.60", default-features = false, features = ["ring", "flate2"] }
rand = "0.9"
futures-util = "0.3"
uuid = { version = "1", features = ["v4"] }
mac-mgmt-common = { path = "../common", features = ["sentry"] }
mac-mgmt-services = { path = "../mac-mgmt-services" }
mac-mgmt-agent = { path = "../mac-mgmt-agent" }
axum = { version = "0.8", optional = true }
dirs = "6"
hex = "0.4"
multihash = "0.19"
hostname = "0.4"
humantime = "2"
notify = "7"
which = { workspace = true }
ramhorns = "1"
mac-mgmt-healer = { path = "../mac-mgmt-healer", default-features = false, optional = true }
plan-ai-cleaner = { path = "../plan-ai-cleaner" }
plan-ai-cloud = { path = "../plan-ai-cloud" }
memvault-mcp = { path = "../memvault/crates/memvault-mcp" }
memctl = { path = "../memvault/crates/memctl", default-features = false }
libp2p = { version = "0.56", default-features = false, features = [
    "tokio", "noise", "yamux", "quic", "tcp", "websocket", "dns",
    "mdns", "relay", "request-response", "identify", "ping",
    "gossipsub", "macros", "serde", "kad",
] }
# Native overview desktop app — its own workspace root; pulled in only by the
# `usb-ui` feature so headless builds never touch the wry/webkitgtk stack.
mac-mgmt-overview = { path = "../mac-mgmt-overview", optional = true }
