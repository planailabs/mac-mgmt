[package]
name = "mac-mgmt"
version = "0.1.5"
edition = "2024"

[lib]
name = "mac_mgmt_daemon"
path = "src/lib.rs"

[[bin]]
name = "mac-mgmt"
path = "src/main.rs"

[features]
default = ["services", "relay", "memvault"]
services = []
self-update = ["dep:self_update", "dep:self-replace"]
relay = ["dep:libp2p-stream"]
memvault = ["dep:memvault-core", "dep:memvault-auth", "dep:memvault-store", "dep:memvault-net", "dep:memvault-web", "memvault-web/server", "dep:memvault-query", "dep:axum", "dep:serde_ipld_dagcbor", "relay"]
healer = ["dep:mac-mgmt-healer", "services", "relay"]
embed = ["memvault-web/embed"]
sim = []
# WASM client for the memvault web UI — built by dx for embedding.
# Both `web` and `server` (via memvault) compile the same App component from
# the same crate, ensuring hydration entry ordering matches perfectly.
web = ["dep:memvault-web", "memvault-web/web", "dep:dioxus", "getrandom_04/wasm_js"]

# Dependencies needed for both native and WASM builds
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
getrandom_04 = { package = "getrandom", version = "0.4" }

# WASM-only dependencies (web feature)
memvault-web = { path = "../memvault/crates/memvault-web", optional = true, default-features = false }
dioxus = { version = "0.8.0-alpha.0", features = ["fullstack", "router"], optional = true }

# Native-only dependencies (not compiled for WASM)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
clap = { version = "4", features = ["derive"] }
self_update = { version = "0.42", default-features = false, features = ["rustls", "archive-tar", "compression-flate2"], optional = true }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
sentry = { workspace = true, features = ["log"] }
rust-embed = { version = "8", features = ["include-exclude", "debug-embed"] }
tempfile = "3"
self-replace = { version = "1", optional = true }
sha2 = "0.10"
libc = "0.2"
pty-process = { version = "0.5", features = ["async"] }
jsonschema = { version = "0.46", default-features = false }
yaml_serde = "0.10"
toml = "0.8"
rocket = { version = "0.5", default-features = false, features = ["json"] }
prometheus = "0.14"
reqwest = { workspace = true, features = ["blocking", "stream"] }
rustls = { workspace = true }
russh = { version = "0.60", default-features = false, features = ["ring", "flate2"] }
rand = "0.9"
futures-util = "0.3"
futures-rustls = { version = "0.26", default-features = false, features = ["ring"] }
uuid = { version = "1", features = ["v4"] }
mac-mgmt-common = { path = "../common", features = ["sentry"] }
mac-mgmt-services = { path = "../mac-mgmt-services" }
dirs = "6"
glob = "0.3"
hex = "0.4"
multihash = "0.19"
hostname = "0.4"
humantime = "2"
notify = "7"
strip-ansi-escapes = "0.2"
sysinfo = { version = "0.33", default-features = false, features = ["system", "disk", "network"] }
regex = "1"
which = { workspace = true }
ramhorns = "1"
mac-mgmt-healer = { path = "../mac-mgmt-healer", default-features = false, optional = true }
plan-ai-cleaner = { path = "../plan-ai-cleaner" }
plan-ai-cloud = { path = "../plan-ai-cloud" }
plan-ai-memvault = { path = "../plan-ai-memvault" }
memvault-api = { path = "../memvault/crates/memvault-api" }
memctl = { path = "../memvault/crates/memctl" }
aes-gcm = "0.10"
tokio-tungstenite = "0.26"
tokio-util = { version = "0.7", features = ["compat"] }
libp2p = { version = "0.56", default-features = false, features = [
    "tokio", "noise", "yamux", "quic", "tcp", "websocket", "dns",
    "mdns", "relay", "request-response", "identify", "ping",
    "gossipsub", "macros", "serde", "kad",
] }
libp2p-stream = { version = "0.4.0-alpha", optional = true }
memvault-core = { path = "../memvault/crates/memvault-core", optional = true }
memvault-auth = { path = "../memvault/crates/memvault-auth", optional = true }
serde_ipld_dagcbor = { version = "0.6", optional = true }
memvault-store = { path = "../memvault/crates/memvault-store", optional = true }
memvault-net = { path = "../memvault/crates/memvault-net", optional = true }
memvault-query = { path = "../memvault/crates/memvault-query", optional = true }
axum = { version = "0.8", optional = true }
