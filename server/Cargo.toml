[package]
name = "mac-mgmt-server"
version = "0.1.0"
edition = "2024"

[features]
default = ["web", "server", "webui"]
web = ["webui", "dioxus/web"]
webui = ["dep:dioxus", "dep:wasm-bindgen", "dep:web-sys", "dep:dioxus-tabular", "dep:pulldown-cmark", "dep:dioxus-i18n", "dep:unic-langid", "dep:plan-ai-design", "dep:plan-ai-chat-ui", "dep:mac-mgmt-config-ui"]
server = ["webui", "dioxus/server", "plan-ai-chat-ui/server", "dep:rocket", "dep:sqlx", "dep:tokio", "dep:sha2", "dep:hex", "dep:rand", "dep:multihash", "dep:tracing-subscriber", "dep:anyhow", "dep:async-trait", "dep:toml", "dep:base64", "dep:reqwest", "dep:rustls", "dep:jsonschema", "dep:utoipa", "dep:utoipa-swagger-ui", "dep:plan-ai-api-mcp", "dep:plan-ai-chat", "dep:similar", "dep:ed25519-dalek", "dep:pulldown-cmark", "dep:rust-embed", "dep:sentry", "dep:mac-mgmt-healer", "dep:tokio-stream", "dep:fs2", "dep:aes-gcm", "dep:zip", "dep:async-compression", "dep:tokio-util", "dep:glob", "dep:scraper", "dep:rmcp", "dep:swiftide", "dep:http", "dep:x509-parser", "mac-mgmt-common/observability", "plan-ai-auth/server"]
server-api-only = ["dep:rocket", "dep:sqlx", "dep:tokio", "dep:sha2", "dep:hex", "dep:rand", "dep:multihash", "dep:tracing-subscriber", "dep:anyhow", "dep:async-trait", "dep:toml", "dep:base64", "dep:reqwest", "dep:rustls", "dep:jsonschema", "dep:utoipa", "dep:utoipa-swagger-ui", "dep:plan-ai-api-mcp", "dep:ed25519-dalek", "dep:rust-embed", "dep:sentry", "dep:mac-mgmt-healer", "dep:tokio-stream", "dep:fs2", "dep:aes-gcm", "dep:x509-parser", "mac-mgmt-common/observability"]

[dependencies]
dioxus = { version = "0.8.0-alpha.0", features = ["fullstack", "router"], optional = true }
plan-ai-design = { path = "../design", optional = true }
mac-mgmt-config-ui = { path = "../config-ui", optional = true }
wasm-bindgen = { version = "=0.2.121", optional = true }
web-sys = { version = "0.3", features = ["EventSource", "MessageEvent", "Event"], optional = true }
rocket = { version = "0.5", default-features = false, features = ["json"], optional = true }
utoipa = { version = "5", features = ["rocket_extras", "uuid", "chrono"], optional = true }
utoipa-swagger-ui = { version = "9", features = ["rocket"], optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4", "v5", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.9", optional = true }
multihash = { version = "0.19", optional = true }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
sentry = { workspace = true, features = ["tracing", "anyhow"], optional = true }
anyhow = { version = "1", optional = true }
async-trait = { version = "0.1", optional = true }
toml = { version = "0.8", optional = true }
plan-ai-auth = { path = "../common/plan-ai-auth" }
jsonschema = { version = "0.45", default-features = false, features = ["resolve-http", "resolve-file", "tls-ring"], optional = true }
serde_json = "1"
base64 = { version = "0.22", optional = true }
reqwest = { workspace = true, features = ["multipart", "stream"], optional = true }
rustls = { workspace = true, optional = true }
dioxus-tabular = { version = "0.3", optional = true }
dioxus-i18n = { version = "0.5", optional = true }
unic-langid = { version = "0.9", features = ["macros"], optional = true }
ed25519-dalek = { version = "2", optional = true }
mac-mgmt-common = { path = "../common" }
mac-mgmt-healer = { path = "../mac-mgmt-healer", optional = true }
tokio-stream = { version = "0.1", optional = true }
schemars = { version = "1.2.1", features = ["derive", "uuid1", "chrono04"] }
plan-ai-api-mcp = { path = "../common/plan-ai-api-mcp", optional = true }
plan-ai-api-mcp-macros = { path = "../common/plan-ai-api-mcp-macros" }
plan-ai-chat = { path = "../common/plan-ai-chat", features = ["postgres", "api-mcp"], optional = true }
plan-ai-chat-ui = { path = "../common/plan-ai-chat-ui", optional = true }
similar = { version = "2", optional = true }
pulldown-cmark = { version = "0.12", optional = true }
rust-embed = { version = "8", features = ["include-exclude"], optional = true }
fs2 = { version = "0.4", optional = true }
aes-gcm = { version = "0.10", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"], optional = true }
async-compression = { version = "0.4", features = ["tokio", "xz"], optional = true }
tokio-util = { version = "0.7", features = ["io"], optional = true }
glob = { version = "0.3", optional = true }
scraper = { version = "0.22", optional = true }
rmcp = { version = "0.17", features = ["server", "macros", "transport-streamable-http-server"], default-features = false, optional = true }
swiftide = { version = "0.32.1", default-features = false, optional = true }
http = { version = "1", optional = true }
x509-parser = { version = "0.16", features = ["verify"], optional = true }

# getrandom 0.2 (pulled in transitively by sqlx, mac-mgmt-healer, etc.)
# needs the "js" feature on wasm32 targets for the WASM client build.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }
