[package]
name = "mac-mgmt-server"
version = "0.1.0"
edition = "2024"

[features]
default = ["web", "server"]
web = ["dioxus/web"]
server = ["dioxus/server", "dep:rocket", "dep:sqlx", "dep:tokio", "dep:sha2", "dep:hex", "dep:rand", "dep:tracing-subscriber", "dep:anyhow", "dep:toml", "dep:axum-oidc-client", "dep:serde_json", "dep:base64", "dep:axum-extra"]

[dependencies]
dioxus = { version = "0.7", features = ["fullstack", "router"] }
wasm-bindgen = "=0.2.114"
rocket = { version = "0.5", default-features = false, optional = true }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
uuid = { version = "1", features = ["v4", "serde", "js"] }
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
sha2 = { version = "0.10", optional = true }
hex = { version = "0.4", optional = true }
rand = { version = "0.9", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", optional = true }
anyhow = { version = "1", optional = true }
toml = { version = "0.8", optional = true }
axum-oidc-client = { version = "0.3", features = ["sql-cache-postgres", "redis"], optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
axum-extra = { version = "0.10", features = ["cookie-private"], optional = true }
dioxus-tabular = "0.3"
mac-mgmt-common = { path = "../common" }
