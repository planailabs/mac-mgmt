[database]
# url = "postgres:///planai?host=/run/postgresql" 
url = "postgresql://planai:changeme123@localhost:5432/planai"

[api]
port = 7378
# external_url = "https://mgmt.example.com:7378"  # used by web UI for download links and swagger-ui (default: http://localhost:<port>)

[web]
port = 7377

[oidc]
client_id = "xxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxx"
redirect_uri = "http://localhost:7377/auth/callback"
allowed_domains = ["example.com"]
# allowed_emails = ["admin@other.com"]  # optional, individual email allowlist
cookie_secret = "generate-with-openssl-rand-hex-32"
# redis_url = "redis://localhost:6379"  # optional, uses PostgreSQL if absent

[xzar]
url = "https://xzar.example.com"
token = "xzar-api-token-here"

# Optional: enables "Generate with AI" buttons in the admin UI
# and provides the cloud fallback for the healer agent (when local
# Ollama is not available on the server).
# [anthropic]
# api_key = "sk-ant-xxx"

# Healer agent: self-healing AI agent for diagnosing and fixing customer servers.
# Tries local Ollama first, falls back to Anthropic (requires [anthropic] key).
# Sessions auto-resume on server restart.
# [healer]
# ollama_url = "http://localhost:11434"         # default
# ollama_model = "qwen3"                        # default; must support tool use
# anthropic_model = "claude-sonnet-4-6"         # default; used when Ollama is unavailable
# token_budget = 200000                          # max tokens per cloud session before auto-pause (0 = unlimited)
