[database]
# url = "postgres:///planai?host=/run/postgresql" 
url = "postgresql://planai:changeme123@localhost:5432/planai"

[api]
port = 7378
# external_url = "https://mgmt.example.com:7378"  # used by web UI for download links and swagger-ui (default: http://localhost:<port>)

# Server mode — controls which API route groups are mounted at runtime.
# Values: "monolith" (default, all modules), "mgmt", "skill-center", "skill-importer"
# Can also be set via MAC_MGMT_SERVER_MODE env var.
# mode = "monolith"

[web]
port = 7377

[auth]
cookie_secret = "generate-with-openssl-rand-hex-32"
external_url = "http://localhost:8080"        # used to derive OIDC callback URLs ({external_url}/auth/{slug}/callback)
# redis_url = "redis://localhost:6379"        # optional, uses PostgreSQL if absent
# admin_emails = ["admin@example.com"]        # auto-granted admin on first login

[[auth.providers]]
slug = "google"
name = "Google"
issuer = "https://accounts.google.com"
client_id = "xxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxx"
allowed_domains = ["example.com"]
# allowed_emails = ["admin@other.com"]    # optional, individual email allowlist
# allow_all = true                        # allow any authenticated user (exclusive with allowed_domains/allowed_emails)
# auto_join_orgs = ["my-org"]             # auto-add users to these orgs on login

# Add more providers:
# [[auth.providers]]
# slug = "github"
# name = "GitHub"
# issuer = "https://token.actions.githubusercontent.com"
# client_id = "Iv1.xxx"
# client_secret = "xxx"
# allowed_emails = ["dev@github.com"]
# auto_join_orgs = ["github-team"]

[xzar]
url = "https://xzar.example.com"
token = "xzar-api-token-here"
public_key = "xzar.example.com:BASE64PUBKEY="

# Optional: enables "Generate with AI" buttons in the admin UI
# and provides the cloud fallback for the healer agent (when local
# Ollama is not available on the server).
# [anthropic]
# api_key = "sk-ant-xxx"

# Git repo clones for commit count resolution (the #N badges in the UI).
# Repos are cloned as bare repos into <state_dir>/repos/ and fetched periodically.
# [git]
# state_dir = "./state"                                             # directory for bare clones
# mac_mgmt_url = "https://git.plan.ai/plan-ai/mac-mgmt.git"        # mac-mgmt repo URL
# nixpkgs_url = "https://git.plan.ai/plan-ai/nixpkgs.git"          # nixpkgs repo URL
# fetch_interval_secs = 300                                         # how often to git fetch (seconds)

# Healer agent: self-healing AI agent for diagnosing and fixing customer servers.
# Tries local Ollama first, falls back to Anthropic, then OpenRouter.
# Sessions auto-resume on server restart.
# [healer]
# ollama_url = "http://localhost:11434"         # default
# ollama_model = "gemma4"                        # default; must support tool use
# anthropic_model = "claude-sonnet-4-6"         # default; used when Ollama is unavailable
# openrouter_api_key = "sk-or-xxx"              # optional; enables OpenRouter as a cloud provider
# openrouter_model = "anthropic/claude-sonnet-4" # default OpenRouter model
# openai_compat_api_key = "sk-xxx"              # legacy single OpenAI-compatible provider (becomes source "openai_compat")
# openai_compat_url = "http://my-vllm:8000/v1"  # legacy; prefer [[healer.openai]] below
# openai_compat_model = "meta-llama/Llama-3.3-70B-Instruct"  # legacy default model
# token_budget = 200000                          # global max tokens per cloud session (0 = unlimited)
# context7_api_key = "c7-..."                   # optional; enables Context7 MCP for documentation lookup
#
# Named OpenAI-compatible sources. Each name doubles as the provider string in
# [[healer.models]] entries and session requests. Names must be unique, must not
# be "ollama"/"anthropic"/"openrouter", and must not contain ':'.
# [[healer.openai]]
# name = "vllm"                                  # provider string for this source
# url = "http://my-vllm:8000/v1"                 # base URL
# api_key = "sk-xxx"                             # optional; omit for local servers
# model = "meta-llama/Llama-3.3-70B-Instruct"    # default model for this source
# [[healer.openai]]
# name = "openai"
# url = "https://api.openai.com/v1"
# api_key = "sk-yyy"
# model = "gpt-4.1"
#
# LEGACY: per-domain model list for the healer picker. Prefer the unified
# top-level [[models]] list (see below) — when [[models]] is present, the
# [[healer.models]] / [[healer.validator_models]] / [[chat.models]] lists are
# ignored. Entry shape is identical (minus validator/restrict).
# [[healer.models]]
# name = "Gemma 4"
# model = "gemma4"
# provider = "ollama"
# [[healer.models]]
# name = "Claude Sonnet 4.6"
# model = "claude-sonnet-4-6"
# provider = "anthropic"
# token_budget = 200000
# input_cost_per_mtok = 3.0
# output_cost_per_mtok = 15.0
# [[healer.models]]
# name = "GPT-4.1"
# model = "openai/gpt-4.1"
# provider = "openrouter"
# token_budget = 200000
# [[healer.models]]
# name = "Llama 3.3 (vLLM)"
# model = "meta-llama/Llama-3.3-70B-Instruct"
# provider = "vllm"                              # references the [[healer.openai]] source above
#
# Auto-trigger: automatically start healer sessions for persistently unhealthy instances.
# auto_trigger = false                            # default: disabled
# auto_trigger_threshold = 10                     # consecutive unhealthy heartbeats before triggering
# auto_trigger_provider = "ollama"                # free local model by default; set to "anthropic" or "openrouter"
# auto_trigger_model = "qwen3:8b"                 # optional; uses provider default if omitted
#
# Fix-model: optional separate model for the remediation phase (after diagnosis/approval).
# When set, the diagnosis model gathers information and the fix-model applies fixes.
# fix_provider = "anthropic"                      # provider for the remediation phase
# fix_model = "claude-sonnet-4-6"                 # model for the remediation phase
#
# LEGACY: validator models for tool-call validation (a cheap/fast second model
# that checks each tool call before executing it). Prefer `validator = true`
# entries in the unified [[models]] list below. If omitted, built-in defaults
# (Gemma 4, Qwen 3, Haiku) are used.
# [[healer.validator_models]]
# name = "Gemma 4"
# model = "gemma4"
# provider = "ollama"
# [[healer.validator_models]]
# name = "Claude Haiku 4.5"
# model = "claude-haiku-4-5-20251001"
# provider = "anthropic"
#
# Per-cluster overrides are managed via the cluster detail UI (Healer section)
# and stored in the healer_cluster_settings table. They override these global
# defaults for: auto_trigger, auto_trigger_provider/model, auto_approve,
# fix_provider/model. An "Override server defaults" toggle enables/disables them.

# Fleet chat: interactive chatbot in the web UI (floating bubble, bottom right).
# The agent's tools are the api-mcp endpoints, dispatched with the chat user's
# permissions; tool calls at or above risk_threshold pause for approval in the
# chat sidebar. Providers/API keys are shared with the healer ([healer] +
# [anthropic] sections); off by default.
# [chat]
# enabled = true
# risk_threshold = "mutating"                    # "mutating" (default) | "destructive" | "never" (no approval gate)
# allow_approve_all = true                       # offer "approve all for this session" (default)
# token_budget = 500000                          # per-session token budget (0 = unlimited)
# max_active_sessions_per_user = 3               # concurrently running agents per user
# idle_park_minutes = 30                         # idle time before a session parks (resumes on next message)
# validator_provider = "ollama"                  # optional guard LLM checking each risky call
# validator_model = "gemma4"
# tools_include = []                             # tool-name globs to offer (empty = all, e.g. ["cluster_*"])
# tools_exclude = []                             # tool-name globs to hide (e.g. ["*_delete"])
#
# LEGACY: separate chat model list. Prefer the unified [[models]] list below;
# falls back to [[healer.models]] (or built-in defaults) when omitted.
# [[chat.models]]
# name = "Claude Sonnet 4.6"
# model = "claude-sonnet-4-6"
# provider = "anthropic"
# input_cost_per_mtok = 3.0
# output_cost_per_mtok = 15.0

# Unified model list for ALL chat types (healer sessions, fleet chat, ...).
# Preferred over the legacy per-domain lists above — when any [[models]] entry
# is present, those lists are ignored. Each entry has: name (display label),
# model (provider identifier), provider ("ollama", "anthropic", "openrouter",
# or a [[healer.openai]] source name), optional token_budget override,
# optional input_cost_per_mtok / output_cost_per_mtok (USD per 1M tokens;
# both set = the AI spend dashboard estimates dollar spend), and:
#   validator = true        # also offered in validator/guard pickers
#   validator_only = true   # hidden from regular model pickers
#   restrict = "healer"     # limit to chat types; string or list, e.g.
#                           # restrict = ["healer", "chat"]; omit = all types
# [[models]]
# name = "Gemma 4"
# model = "gemma4"
# provider = "ollama"
# validator = true                               # doubles as a guard model
# [[models]]
# name = "Claude Sonnet 4.6"
# model = "claude-sonnet-4-6"
# provider = "anthropic"
# token_budget = 200000
# input_cost_per_mtok = 3.0
# output_cost_per_mtok = 15.0
# [[models]]
# name = "Claude Haiku 4.5"
# model = "claude-haiku-4-5-20251001"
# provider = "anthropic"
# validator = true
# validator_only = true                          # guard only, not in pickers
# [[models]]
# name = "Devstral"
# model = "devstral"
# provider = "ollama"
# restrict = "healer"                            # healer sessions only

# Secrets vault: encrypted key-value store for daemon secrets (requires "mgmt" feature).
# Daemons reference secrets in config via secret:NAME syntax.
# [secrets]
# encryption_key = "base64-encoded-32-byte-key"  # generate with: openssl rand -base64 32

# Skill importer: import skills from git repos and ClawHub (requires "skill-importer" feature).
# [importer]
# work_dir = "/tmp/mac-mgmt-import"               # temp dir for git clones (default)
# clawhub_url = "https://wry-manatee-359.convex.site"  # ClawHub API URL (default)
# sync_interval_secs = 3600                      # auto-sync interval (seconds)
