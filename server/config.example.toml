# allowed_emails = ["dev@github.com"]
# auto_join_orgs = ["github-team"]

[xzar]
url = "https://xzar.example.com"
token = "xzar-api-token-here"
public_key = "xzar.example.com:BASE64PUBKEY="

# Optional: enables "Generate with AI" buttons in the admin UI
# and provides the cloud fallback for the healer agent (when local
# Ollama is not available on the server).
# [anthropic]
# api_key = "sk-ant-xxx"

# Git repo clones for commit count resolution (the #N badges in the UI).
# Repos are cloned as bare repos into <state_dir>/repos/ and fetched periodically.
# [git]
# state_dir = "./state"                                             # directory for bare clones
# mac_mgmt_url = "https://git.plan.ai/plan-ai/mac-mgmt.git"        # mac-mgmt repo URL
# nixpkgs_url = "https://git.plan.ai/plan-ai/nixpkgs.git"          # nixpkgs repo URL
# fetch_interval_secs = 300                                         # how often to git fetch (seconds)

# Healer agent: self-healing AI agent for diagnosing and fixing customer servers.
# Tries local Ollama first, falls back to Anthropic, then OpenRouter.
# Sessions auto-resume on server restart.
# [healer]
# ollama_url = "http://localhost:11434"         # default
# ollama_model = "gemma4"                        # default; must support tool use
# anthropic_model = "claude-sonnet-4-6"         # default; used when Ollama is unavailable
# openrouter_api_key = "sk-or-xxx"              # optional; enables OpenRouter as a cloud provider
# openrouter_model = "anthropic/claude-sonnet-4" # default OpenRouter model
# openai_compat_api_key = "sk-xxx"              # optional; generic OpenAI-compatible provider
# openai_compat_url = "http://my-vllm:8000/v1"  # base URL for the OpenAI-compatible API
# openai_compat_model = "meta-llama/Llama-3.3-70B-Instruct"  # default model
# token_budget = 200000                          # global max tokens per cloud session (0 = unlimited)
# context7_api_key = "c7-..."                   # optional; enables Context7 MCP for documentation lookup
#
# Models shown in the UI model picker. If omitted, built-in defaults are used.
# Each entry has: name (display label), model (provider identifier),
# provider ("ollama", "anthropic", "openrouter", or "openai_compat"), and optional token_budget override.
# [[healer.models]]
# name = "Gemma 4"
# model = "gemma4"
# provider = "ollama"
# [[healer.models]]
# name = "Claude Sonnet 4.6"
# model = "claude-sonnet-4-6"
# provider = "anthropic"
# token_budget = 200000
# [[healer.models]]
# name = "GPT-4.1"
# model = "openai/gpt-4.1"
# provider = "openrouter"
# token_budget = 200000
# [[healer.models]]
# name = "Llama 3.3 (vLLM)"
# model = "meta-llama/Llama-3.3-70B-Instruct"
# provider = "openai_compat"
#
# Auto-trigger: automatically start healer sessions for persistently unhealthy instances.
# auto_trigger = false                            # default: disabled
# auto_trigger_threshold = 10                     # consecutive unhealthy heartbeats before triggering
# auto_trigger_provider = "ollama"                # free local model by default; set to "anthropic" or "openrouter"
# auto_trigger_model = "qwen3:8b"                 # optional; uses provider default if omitted
#
# Fix-model: optional separate model for the remediation phase (after diagnosis/approval).
# When set, the diagnosis model gathers information and the fix-model applies fixes.
# fix_provider = "anthropic"                      # provider for the remediation phase
# fix_model = "claude-sonnet-4-6"                 # model for the remediation phase
#
# Per-cluster overrides are managed via the cluster detail UI (Healer section)
# and stored in the healer_cluster_settings table. They override these global
# defaults for: auto_trigger, auto_trigger_provider/model, auto_approve,
# fix_provider/model. An "Override server defaults" toggle enables/disables them.

# Secrets vault: encrypted key-value store for daemon secrets (requires "mgmt" feature).
# Daemons reference secrets in config via secret:NAME syntax.
# [secrets]
# encryption_key = "base64-encoded-32-byte-key"  # generate with: openssl rand -base64 32

# Skill importer: import skills from git repos and ClawHub (requires "skill-importer" feature).
# [importer]
# work_dir = "./import-work"                     # temp dir for git clones
# clawhub_url = "https://clawhub.ai"             # ClawHub registry URL
# sync_interval_secs = 3600                      # auto-sync interval (seconds)
