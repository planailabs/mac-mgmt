[database]
# url = "postgres:///planai?host=/run/postgresql" 
url = "postgresql://planai:changeme123@localhost:5432/planai"

[api]
port = 7378
# external_url = "https://mgmt.example.com:7378"  # used by web UI for download links and swagger-ui (default: http://localhost:<port>)

[web]
port = 7377

[auth]
cookie_secret = "generate-with-openssl-rand-hex-32"
external_url = "http://localhost:8080"        # used to derive OIDC callback URLs ({external_url}/auth/{slug}/callback)
# redis_url = "redis://localhost:6379"        # optional, uses PostgreSQL if absent
# admin_emails = ["admin@example.com"]        # auto-granted admin on first login

[[auth.providers]]
slug = "google"
name = "Google"
issuer = "https://accounts.google.com"
client_id = "xxx.apps.googleusercontent.com"
client_secret = "GOCSPX-xxx"
allowed_domains = ["example.com"]
# allowed_emails = ["admin@other.com"]    # optional, individual email allowlist
# allow_all = true                        # allow any authenticated user (exclusive with allowed_domains/allowed_emails)
# auto_join_orgs = ["my-org"]             # auto-add users to these orgs on login

