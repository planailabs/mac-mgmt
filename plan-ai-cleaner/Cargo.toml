[package]
name = "plan-ai-cleaner"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "plan-ai-cleaner"
path = "src/main.rs"

[dependencies]
aes-gcm = "0.10"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
hkdf = "0.12"
rand = "0.9"
regex = "1"
reqwest = { workspace = true }
rmcp = { version = "0.17", features = ["server", "transport-io", "macros"], default-features = false }
rustls = { workspace = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["full", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
rmcp = { version = "0.17", features = ["client", "transport-child-process", "macros"], default-features = false }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
