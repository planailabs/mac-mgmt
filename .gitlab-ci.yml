stages:
  - build
  - test
  - deploy

before_script:
  # The custom executor mounts /cache for Cargo, but `ln -s /cache/cargo
  # ~/.cargo` creates a broken symlink when the target directory has not been
  # initialized yet. Cargo may tolerate a different CARGO_HOME during early
  # shell setup while `dx build` later falls back to $HOME/.cargo and fails with
  # "File exists" while trying to create the broken symlink path. Initialize the
  # target first and export CARGO_HOME so every nested tool uses the same cache.
  - mkdir -p /cache/cargo
  - rm -rf ~/.cargo
  - ln -s /cache/cargo ~/.cargo
  - export CARGO_HOME="$HOME/.cargo"
  # Cargo's build dir lives in the cache volume: gitlab-nix-ci's /.cargo
  # config sets it (cargoTargetCache.plainBuildDir).

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build:
  stage: build
  tags:
    - nix-image
  script:
    - bash prebuild.sh
  # 8h, not 6h. A nixpkgs bump (the nightly flake-input refresh) changes the
  # hash of every derivation, so this job is cold on every night it runs: the
  # custom executor's pre-script `flake#image` build, then prebuild.sh
  # (devshell, image, and the nine binaries, with the 1655-crate `dx` compile
  # of `.#default` inside it) all have to fit in one budget. 6h stopped
  # containing that: pipeline 3053 (job 7517, 2026-10-31) was killed by the
  # cap at 21904s with six of the nine packages pinned and only `runner`,
  # `relay-ssh` and `nix-driver-sync` left -- ~15 min of work at the rate of
  # the last warm night (job 7498). The 10-30 build never started
  # (`stuck_pending_no_matching_runners`, job 7511), so the nixpkgs closure
  # from 282fa04c had never been warmed and 3053 then had to build 1452 cold
  # derivations plus a 49-minute devshell rebuild of the patched dioxus-cli.
  # Measured cold-night cost is therefore ~6h20m, against 4h46m (job 7498) and
  # 5h51m (job 7457) for the same job on warmer trees, and single Rust
  # segments still vary up to ~2x with runner load. This is headroom, not a
  # speed fix: per-crate throughput on the current runners is still well below
  # the 2026-08 baseline (~99 min for a warm build, jobs 5873/5736), so cache
  # warming and runner capacity remain the real limit. Per-step trace output
  # still bounds a genuine hang.
  timeout: 8h
  resource_group: build-cache

test:
  stage: test
  tags:
    - nix-image
  script:
    - nix develop -c bash build-memvault.sh
    - nix develop -c cargo test --workspace --locked --exclude mac-mgmt-executor
  timeout: 3h

deploy:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    # VM-backed flake checks are resource-heavy; run them serially so one
    # test VM cannot starve another until the NixOS backdoor times out. Each
    # build still gets 4 cores (cargo -j $NIX_BUILD_CORES).
    - nix flake check -L --max-jobs 1 --cores 4
    - nix develop -c bash xzar.sh
    # Run through the flake dev shell instead of the script's legacy nix-shell
    # shebang. The runner's impure NIX_PATH/channel can be stale or GC'd, while
    # `nix develop` resolves tools from the locked flake inputs already used by
    # the rest of the job.
    - nix develop -c bash docker-push.sh
  # 6h, not 3h: the first step is a full `nix flake check -L --max-jobs 1`,
  # which needs roughly 4h15m cold on this repo (1282 derivations after a
  # nixpkgs bump) -- longer than the old cap, which was already sitting at
  # ~2h50m even with a warm cache (job 5875: 10307s of a 10800s cap). xzar.sh
  # and docker-push.sh run after the check, so the deploy itself needs the
  # extra headroom too.
  timeout: 6h
  environment: production
  resource_group: production

# Sovereign-AI USB build: per-arch static-musl `mac-mgmt --features usb`
# tarballs published as GitLab Release assets, which the in-binary updater
# (daemon/src/usb_update.rs) downloads. Separate from the xzar/docker deploy.
usb-release:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    - nix develop -c bash usb-release.sh
  timeout: 3h
  environment: production
  resource_group: production
