stages:
  - test
  - build

test:
  stage: test
  tags:
    - nix
  script:
    - nix develop -c bash build-memvault.sh
    - nix develop -c cargo test --workspace --locked --exclude mac-mgmt-executor
  timeout: 3h

build:
  stage: build
  tags:
    - nix
  only:
    - trunk
  script:
    - nix flake check -L
    - bash xzar-install.sh
    - nix develop -c bash xzar.sh
    - ./docker-push.sh
  timeout: 3h
  environment: production
  resource_group: production
