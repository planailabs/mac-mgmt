stages:
  - build
  - test
  - deploy

before_script:
  # The custom executor mounts /cache for Cargo, but `ln -s /cache/cargo
  # ~/.cargo` creates a broken symlink when the target directory has not been
  # initialized yet. Cargo may tolerate a different CARGO_HOME during early
  # shell setup while `dx build` later falls back to $HOME/.cargo and fails with
  # "File exists" while trying to create the broken symlink path. Initialize the
  # target first and export CARGO_HOME so every nested tool uses the same cache.
  - mkdir -p /cache/cargo
  - rm -rf ~/.cargo
  - ln -s /cache/cargo ~/.cargo
  - export CARGO_HOME="$HOME/.cargo"

variables:
  GIT_SUBMODULE_STRATEGY: recursive

build:
  stage: build
  tags:
    - nix-image
  script:
    - bash prebuild.sh
  timeout: 3h
  resource_group: build-cache

test:
  stage: test
  tags:
    - nix-image
  script:
    # Keep the canonical design path through the following workspace test.
    # Cargo otherwise sees ./design and memvault/plan-ai-design as two lockfile
    # identities after build-memvault.sh restores the nested manifest.
    - MEMVAULT_KEEP_CANONICAL_MANIFEST=1 nix develop -c bash build-memvault.sh
    - nix develop -c cargo test --workspace --locked --exclude mac-mgmt-executor
  after_script:
    - git -C memvault checkout -- crates/memvault-web/Cargo.toml
  timeout: 3h

deploy:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    # VM-backed flake checks are resource-heavy; run them serially so one
    # test VM cannot starve another until the NixOS backdoor times out.
    - nix flake check -L --max-jobs 1
    - nix develop -c bash xzar.sh
    # Run through the flake dev shell instead of the script's legacy nix-shell
    # shebang. The runner's impure NIX_PATH/channel can be stale or GC'd, while
    # `nix develop` resolves tools from the locked flake inputs already used by
    # the rest of the job.
    - nix develop -c bash docker-push.sh
  timeout: 3h
  environment: production
  resource_group: production

# Sovereign-AI USB build: per-arch static-musl `mac-mgmt --features usb`
# tarballs published as GitLab Release assets, which the in-binary updater
# (daemon/src/usb_update.rs) downloads. Separate from the xzar/docker deploy.
usb-release:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    - nix develop -c bash usb-release.sh
  timeout: 3h
  environment: production
  resource_group: production
