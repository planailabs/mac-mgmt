stages:
  - build
  - test
  - deploy

before_script:
  # The custom executor mounts /cache for Cargo, but `ln -s /cache/cargo
  # ~/.cargo` creates a broken symlink when the target directory has not been
  # initialized yet. Cargo may tolerate a different CARGO_HOME during early
  # shell setup while `dx build` later falls back to $HOME/.cargo and fails with
  # "File exists" while trying to create the broken symlink path. Initialize the
  # target first and export CARGO_HOME so every nested tool uses the same cache.
  - mkdir -p /cache/cargo
  - rm -rf ~/.cargo
  - ln -s /cache/cargo ~/.cargo
  - export CARGO_HOME="$HOME/.cargo"

variables:
  GIT_SUBMODULE_STRATEGY: recursive

# plan-ai-design is checked out twice: the top-level submodule (used by the
# combined mac-mgmt build) and memvault/plan-ai-design (used only when memvault
# builds standalone). The two builds compile memvault-web against whichever copy
# they see, so a divergence is a silent behavioural skew that no compiler or
# Cargo semver check can catch. Fail loudly when the pointers drift.
check-design-pinning:
  stage: build
  tags:
    - nix-image
  script:
    - |
      top="$(git -C plan-ai-design rev-parse HEAD)"
      nested="$(git -C memvault/plan-ai-design rev-parse HEAD)"
      if [ "$top" != "$nested" ]; then
        echo "plan-ai-design submodule pointers diverge:"
        echo "  top-level (plan-ai-design):          $top"
        echo "  nested    (memvault/plan-ai-design): $nested"
        echo "Bump both to the same commit so standalone memvault and the combined build compile the same design code."
        exit 1
      fi
      echo "plan-ai-design pinned consistently at $top"
  timeout: 10m

build:
  stage: build
  tags:
    - nix-image
  script:
    - bash prebuild.sh
  timeout: 3h
  resource_group: build-cache

test:
  stage: test
  tags:
    - nix-image
  script:
    - nix develop -c bash build-memvault.sh
    - nix develop -c cargo test --workspace --locked --exclude mac-mgmt-executor
  timeout: 3h

deploy:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    # VM-backed flake checks are resource-heavy; run them serially so one
    # test VM cannot starve another until the NixOS backdoor times out.
    - nix flake check -L --max-jobs 1
    - nix develop -c bash xzar.sh
    - ./docker-push.sh
  timeout: 3h
  environment: production
  resource_group: production
