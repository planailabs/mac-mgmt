stages:
  - build
  - test
  - deploy

build:
  stage: build
  tags:
    - nix-image
  script:
    - bash prebuild.sh
  timeout: 3h
  resource_group: build-cache

test:
  stage: test
  tags:
    - nix-image
  script:
    - nix develop -c bash build-memvault.sh
    - nix develop -c cargo test --workspace --locked --exclude mac-mgmt-executor
  timeout: 3h

deploy:
  stage: deploy
  tags:
    - nix-image
  only:
    - trunk
  script:
    - nix flake check -L
    - nix develop -c bash xzar.sh
    - ./docker-push.sh
  timeout: 3h
  environment: production
  resource_group: production
