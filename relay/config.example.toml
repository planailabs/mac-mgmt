# Address to listen on for WebSocket + REST API
listen_addr = "0.0.0.0:7379"

# Port range for dynamically allocated SSH tunnels
ssh_port_min = 30000
ssh_port_max = 40000

# mac-mgmt server API URL, used to validate tokens
server_api_url = "http://localhost:7378"

# Wildcard proxy hostname for browser-based TCP tunnel access.
# When set, *.relay.plan.ai routes are handled as proxy endpoints.
proxy_hostname = "localhost"

# Full external URL of the relay API. Sent to daemons and included in
# heartbeats so the server can reach the relay without extra config.
# Defaults to https://{proxy_hostname} if not set.
proxy_url = "http://localhost:7379"

# Origins allowed to make cross-origin requests to the proxy
# (e.g. the management server's web UI). Can be full URLs
# ("http://localhost:8080") or host/host:port suffixes ("localhost").
# Default: ["localhost"]
cors_origins = ["localhost:8080"]

# Directory for persistent data (port reservations).
data_dir = "/tmp/mac-mgmt-relay"
