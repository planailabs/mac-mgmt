[package]
name = "mac-mgmt-services"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
which = { workspace = true }
# cross-platform local socket (unix domain socket / windows named pipe) for the
# daemon<->supervisor RPC, so the supervisor builds + runs on windows too.
interprocess = { version = "2", features = ["tokio"] }

# unix-only process primitives (kill/waitpid); windows uses windows-sys (procutil)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }

[dev-dependencies]
tempfile = "3"
