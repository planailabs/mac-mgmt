# mmrc — chaos CLI config.
# Copy to ~/.config/mmrc/config.toml (or pass --config <path>).
# The active environment is chosen by MMRC_ENV, else --env, else default_env.

default_env = "antithesis"

# ── Production (mmr) cluster ─────────────────────────────────────────
# Real cluster, real tokens. mmrc does NOT spawn nodes here (fleet nodes are
# provisioned by the runner; the chaos API is disabled in prod) — it targets
# already-enrolled nodes.
[env.prod]
server_url      = "https://mgmt.plan.ai"   # REST API base (api.external_url), NOT the web UI
admin_token     = "CHANGE-ME-admin-token"
relay_url       = "https://relay.plan.ai"
organization_id = "00000000-0000-0000-0000-000000000000"
cluster_name    = "mmrc"
ec_timeout_secs = 600

# ── Antithesis (fresh incus) cluster, via mmrcd ──────────────────────
[env.antithesis]
mmrcd_url       = "http://127.0.0.1:7390"
mmrcd_token     = "CHANGE-ME-mmrcd-bearer-token"   # must match mmrcd's `token`
admin_token     = "admin"                          # seeded by the test-server image
proxy_hostname  = "test-mac-mgmt-relay"            # relay Host-header selection
cluster_name    = "mmrc"
organization_id = "00000000-0000-0000-0000-000000000000"
ec_timeout_secs = 120

# ── Emulator defaults (overridable by `mmrc emulator run` flags) ─────
[emulator]
rounds              = 1
workloads_per_round = 6
nodes               = 2
# run_dir = "~/.local/state/mmrc/runs"   # default derived from XDG state dir
