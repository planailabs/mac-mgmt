[package]
name = "mac-mgmt-executor"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "mac-mgmt-executor"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive", "env"] }
rand = "0.9"
reqwest = { workspace = true }
rmcp = { version = "0.17", features = ["server", "transport-io", "macros"], default-features = false }
rustls = { workspace = true }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full", "process", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
rmcp = { version = "0.17", features = ["client", "transport-child-process", "macros"], default-features = false }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
