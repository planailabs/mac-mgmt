[package]
name = "antithesis-workloads"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde"] }
reqwest = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["time", "rt", "macros"] }
tracing = "0.1"
urlencoding = "2"
uuid = { version = "1", features = ["v4", "serde"] }

# Optional: real Antithesis SDK. Off by default so the local emulator and CI
# build without it; enable when building workload binaries for the Antithesis
# platform.
antithesis_sdk = { version = "0.2", optional = true }

[features]
default = []
antithesis = ["dep:antithesis_sdk"]
