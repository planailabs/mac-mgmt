[package]
name = "mac-mgmt-healer"
version = "0.1.0"
edition = "2024"

[features]
default = ["postgres"]
postgres = ["dep:sqlx", "sqlx?/postgres"]

[dependencies]
swiftide = { version = "0.32.1", default-features = false, features = ["ollama", "anthropic", "openai", "swiftide-agents", "mcp"] }
rmcp = { version = "0.17", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest", "reqwest-tls-no-provider"], default-features = false }
schemars = { version = "1.2", features = ["derive"] }
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "uuid", "chrono", "json"], optional = true }
reqwest = { workspace = true }
rustls = { workspace = true }
tokio = { version = "1", features = ["full", "io-util"] }
tokio-util = { version = "0.7", features = ["codec", "rt"] }
mac-mgmt-common = { path = "../common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
anyhow = "1"
async-trait = "0.1"
sha2 = "0.10"
hex = "0.4"
rand = "0.9"
dashmap = "6"
urlencoding = "2"
rust-embed = { version = "8", features = ["include-exclude"] }
async-openai = ">=0.33"
